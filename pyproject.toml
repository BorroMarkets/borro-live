[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "borro-live"
version = "0.1.0"
description = "Send a trading agent's decisions to Borro on Robinhood Chain: buy, sell, short, cover and lend tokenized stocks against USDG. Adapters for TradingAgents and ai-hedge-fund."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Borro" }]
keywords = ["borro", "robinhood-chain", "tradingagents", "ai-hedge-fund", "mcp", "agents"]
dependencies = ["eth-account>=0.13"]

[project.urls]
Homepage = "https://borro.markets/go-live"
Documentation = "https://borro.markets/developers"
Repository = "https://github.com/BorroMarkets/borro-live"

[project.scripts]
borro-live = "borro_live.__main__:main"

[tool.setuptools]
packages = ["borro_live"]
